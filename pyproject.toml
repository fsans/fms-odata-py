[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fms-odata-py"
version = "0.1.0"
description = "Synchronous Python client for the FileMaker Server OData v4 API. Functional equivalent of fms-odata-js."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    { name = "Francesc Sans", email = "tecnic@ntwk.es" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
keywords = ["filemaker", "claris", "odata", "fms", "client", "rest", "sync"]
dependencies = [
    "httpx>=0.27",
    "fms-odata-spec>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "build>=1.0",
    "twine>=4.0",
]

[project.urls]
Homepage = "https://github.com/fsans/fms-odata-py"
Repository = "https://github.com/fsans/fms-odata-py"
Issues = "https://github.com/fsans/fms-odata-py/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/fms_odata"]

[tool.hatch.build.targets.sdist]
include = [
    "src/fms_odata",
    "tests",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
